<!doctype html>
<html lang="en" class="dark" style="background-color: #0b0e14; color: #f1f5f9; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocuGuard Edge — AI Document Forensics</title>
    <meta name="description" content="Privacy-first AI-powered identity document verification. Runs entirely in your browser." />
    <meta property="og:title" content="DocuGuard Edge — AI Document Forensics" />
    <meta property="og:description" content="Privacy-first AI-powered identity document verification. Runs entirely in your browser." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // Unregister any legacy Service Workers that may serve stale HTML/chunks on Vercel
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        }).catch(function() {});
      }
      // Recover automatically once if a stale Vercel deployment chunk fails to load
      window.addEventListener('vite:preloadError', function() {
        if (!sessionStorage.getItem('dg_chunk_reload')) {
          sessionStorage.setItem('dg_chunk_reload', '1');
          window.location.reload();
        }
      });
    </script>
  </head>
  <body class="bg-[#0b0e14] text-slate-100 antialiased selection:bg-indigo-600 selection:text-white" style="background-color: #0b0e14; color: #f1f5f9; margin: 0; min-height: 100vh;">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0b0e14; color: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px;">
        <div style="width: 36px; height: 36px; border-radius: 10px; background: rgba(99, 102, 241, 0.15); border: 1px solid rgba(99, 102, 241, 0.35); display: flex; align-items: center; justify-content: center; margin-bottom: 12px; color: #818cf8; font-weight: 700;">
          DG
        </div>
        <div style="color: #f1f5f9; font-weight: 600; margin-bottom: 4px;">DocuGuard Edge</div>
        <div style="font-size: 12px; color: #64748b;">Initializing local forensic workspace...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
